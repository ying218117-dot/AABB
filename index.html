<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AABB 糖葫蘆小店</title>
<style>
/* 1rem = 畫面闊度的 1%（16:9 舞台：100rem × 56.25rem） */
html{font-size:min(1vw,1.7778vh)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#5a2d1a;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-family:"PingFang HK","Microsoft JhengHei","Noto Sans TC","Heiti TC",sans-serif;color:#4a2a12}
#stage{position:relative;width:100rem;height:56.25rem;background:#fff6e4;display:flex;flex-direction:column;overflow:hidden}
.kai{font-family:"DFKai-SB","BiauKai","Kaiti TC","標楷體","PingFang HK","Microsoft JhengHei",sans-serif}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

/* 頂部 */
header{height:5.6rem;background:#c63d2f;color:#fff;display:flex;align-items:center;gap:1rem;padding:0 1.5rem;flex:none}
header h1{font-size:2.5rem;letter-spacing:.1rem;white-space:nowrap}
.tabs{display:flex;gap:.6rem;margin-left:1rem;flex:1}
.tab{font-size:1.7rem;padding:.5rem 1.2rem;border-radius:2rem;border:.2rem solid #ffd9b0;background:transparent;color:#fff}
.tab.on{background:#fff6e4;color:#b02f22;font-weight:700}
.top{font-size:1.6rem;padding:.5rem 1.1rem;border-radius:.8rem;border:none;background:#8f2418;color:#fff}
.awning{height:1.3rem;flex:none;background:repeating-linear-gradient(90deg,#c63d2f 0 4rem,#fff 4rem 8rem);border-bottom-left-radius:0;box-shadow:0 .3rem .5rem rgba(90,45,26,.25)}

/* 主區 */
main{flex:1;display:flex;flex-direction:column;padding:1rem 2rem .5rem;min-height:0}
footer{height:6.4rem;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;background:#f6e3c2}
.btn{font-size:2.3rem;min-height:4.6rem;padding:.4rem 2rem;border-radius:1.2rem;border:.25rem solid #c98a4b;background:#fff;font-weight:700}
.btn.pri{background:#e0483a;border-color:#a92c20;color:#fff}
.btn.big{font-size:3rem;min-height:6rem;padding:.4rem 3rem}
.btn:disabled{opacity:.35;cursor:default}
.btn.sm{font-size:1.6rem;min-height:3.2rem;padding:.2rem 1rem;border-width:.18rem;border-radius:.8rem}
.btn.on{background:#ffe08a;border-color:#d98206}
.row{display:flex;align-items:center;justify-content:center;gap:1.5rem}
.msg{font-size:2.3rem;font-weight:700;color:#b5521a;min-height:3rem;text-align:center}
.cue{font-size:2rem;color:#7a5a3a;text-align:center}
.slogan{font-size:2.8rem;font-weight:700;color:#b02f22;text-align:center}

/* 糖葫蘆 */
.hulu{--b:5rem;position:relative;display:inline-flex;align-items:center;gap:.25rem;margin:0 3rem 0 1.5rem}
.hulu.small{--b:4rem}
.stick{position:absolute;left:-1.5rem;right:-3rem;top:50%;height:.5rem;margin-top:-.25rem;background:#b98a52;border-radius:.3rem}
.ball{position:relative;width:var(--b);height:var(--b);border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--b)*.62);overflow:hidden;flex:none;
  font-family:"DFKai-SB","BiauKai","Kaiti TC","標楷體","PingFang HK","Microsoft JhengHei",sans-serif;font-weight:500}
.ball.ca{background:radial-gradient(circle at 30% 26%,#ffa596,#e23b2e 55%,#b01d18);color:#fff}
.ball.cb{background:radial-gradient(circle at 30% 26%,#fff0b0,#f7b32b 55%,#dc8a08);color:#4a2500}
.ball.empty{background:#fff6e4;border:.3rem dashed #d9b38a}
.ball.pop{animation:pop .4s both}
.ball.grow{animation:grow .8s both}
@keyframes pop{from{transform:scale(0);opacity:0}70%{transform:scale(1.15)}to{transform:scale(1);opacity:1}}
@keyframes grow{from{width:0;opacity:0;transform:scale(.4)}60%{width:var(--b);opacity:1;transform:scale(1.15)}to{width:var(--b);transform:scale(1)}}

/* 第一關 */
.l1{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-height:0}
.shelf{display:grid;grid-template-columns:repeat(4,1fr);height:6.5rem;align-items:center;justify-items:center}
.shelf .hulu{--b:4.2rem;margin:0 2rem 0 1rem}
.match{position:relative;flex:1;display:flex;flex-direction:column;justify-content:space-between;margin:.5rem 0}
.match svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.match .line{display:grid;grid-template-columns:repeat(4,1fr);justify-items:center}
.half{font-size:3.6rem;width:15rem;height:6.6rem;border-radius:1.4rem;border:.3rem solid #c98a4b;background:#fff;font-weight:700}
.half.f{background:#ffe3dc;border-color:#e0483a}
.half.b{background:#fff0c4;border-color:#e09a1a}
.half.sel{box-shadow:0 0 0 .6rem #6bb7ff;transform:scale(1.05)}
.half.ok{background:#d9f5d0;border-color:#3f9b3a}
.half.no{border-style:dashed;border-color:#e07b1a}

/* 第二關 */
.prompt{font-size:2.7rem;font-weight:700;text-align:center;line-height:1.35}
.slots{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;margin:1rem 0;min-height:0}
.slot{background:#fff;border:.25rem solid #f0d3a8;border-radius:1.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;position:relative}
.slot.faint{opacity:.45}
.slot.pending{border-style:dashed;border-color:#e09a1a;background:#fffbea}
.orig{font-size:2.6rem;font-weight:700;min-height:3.2rem}
.badge{position:absolute;top:.6rem;right:.8rem;font-size:1.6rem;background:#f7b32b;color:#4a2500;border-radius:1rem;padding:.2rem .9rem;font-weight:700}
.tip{font-size:1.9rem;text-align:center;color:#7a5a3a}
.hints{display:flex;justify-content:center;gap:1.2rem;min-height:3.6rem;align-items:center;margin:.4rem 0}
.hints span{font-size:2rem;background:#e5f3ff;border-radius:1rem;padding:.3rem 1.2rem;font-weight:700;color:#1f5b8f}
.form{display:flex;align-items:flex-end;justify-content:center;gap:1.2rem}
.form label{font-size:1.7rem;display:flex;flex-direction:column;gap:.2rem;font-weight:700}
input[type=text]{font:inherit;font-size:2.8rem;height:4.6rem;border:.25rem solid #c98a4b;border-radius:1rem;padding:0 1rem;background:#fff;color:#4a2a12;width:15rem}
input.wide{width:20rem}

/* 第三關 */
.sent{font-size:3.3rem;line-height:1.5;background:#fff;border:.25rem solid #f0d3a8;border-radius:1.5rem;padding:.8rem 1.6rem;min-height:7rem;display:flex;align-items:center;flex-wrap:wrap}
.sent.dim{color:#a08363;justify-content:center;font-size:2.8rem}
.sent .s{display:inline}
.blank{display:inline-block;width:13rem;height:3.6rem;border-bottom:.35rem solid #4a2a12;margin:0 .4rem;vertical-align:bottom}
.fill{color:#c63d2f;border-bottom:.35rem solid #e0483a}
.tick{color:#3f9b3a;font-weight:700;margin-left:1rem}
.combo .hulu{--b:6.4rem}
.combo{height:9rem;display:flex;align-items:center;justify-content:center;gap:1rem}
.plus{font-size:3rem;color:#a08363;font-weight:700}
.chip{font-size:3.6rem;font-weight:700;min-width:6rem;height:6rem;padding:0 1.5rem;border-radius:1.2rem;display:flex;align-items:center;justify-content:center;background:#e5f3ff;border:.25rem solid #6bb7ff}
.chip.w{background:#e6f7df;border-color:#6dbb62;min-width:10rem}
.cards{display:flex;align-items:center;gap:1.2rem;margin-bottom:.6rem}
.card{font-size:2.8rem;font-weight:700;height:4.8rem;padding:0 2rem;border-radius:1.2rem;border:.25rem solid #c98a4b;background:#fff}
.card.on{background:#ffe08a;border-color:#d98206;box-shadow:0 0 0 .4rem #ffd15c}
.card.done::after{content:" ✓";color:#3f9b3a}
.steps{margin-left:auto;display:flex;align-items:center;gap:.5rem;font-size:1.9rem;font-weight:700}
.dot{width:2.6rem;height:2.6rem;border-radius:50%;background:#ead7b8;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.dot.on{background:#e0483a}.dot.past{background:#e9a79f}
.panel{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;background:#fdebd0;border-radius:1.5rem;padding:.6rem 1.5rem;min-height:0}
.panel .ask{font-size:2.4rem;font-weight:700;text-align:center}
.de{font-size:4.6rem;width:11rem;height:7.5rem;border-radius:1.6rem;border:.3rem solid #6bb7ff;background:#fff;font-weight:700}
.de.sm{font-size:3rem;width:5.5rem;height:4.6rem;border-radius:1rem}
.de.on{background:#bfe0ff;border-color:#1f77c9}
.note{font-size:1.8rem;color:#7a5a3a;text-align:center}
.ref{font-size:2.3rem;font-weight:700;color:#1f5b8f;text-align:center}

/* 總結 */
.sum{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly}
.sum h2{font-size:4rem;color:#b02f22}
.ex{display:flex;align-items:center;gap:1rem}
.ex .gap{width:2.5rem}
.ex .cap{font-size:2.1rem;color:#7a5a3a;margin-left:2rem;width:16rem}
.q{font-size:2.8rem;font-weight:700;background:#fff;border:.25rem solid #f0d3a8;border-radius:1.5rem;padding:.8rem 2.5rem}

/* 確認視窗 */
.overlay{position:absolute;inset:0;background:rgba(60,30,15,.55);display:flex;align-items:center;justify-content:center;z-index:9}
.dialog{background:#fff;border-radius:2rem;padding:3rem 4rem;text-align:center;max-width:60rem}
.dialog p{font-size:2.8rem;font-weight:700;margin-bottom:2.5rem;line-height:1.4}
.dialog .row{gap:6rem}

/* 第二版 */
.l1b{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-height:0}
.task{font-size:3.2rem;font-weight:700;color:#b02f22;text-align:center}
.shelf4{display:grid;grid-template-columns:repeat(4,1fr);justify-items:center}
.cell{display:flex;flex-direction:column;align-items:center;gap:.5rem}
.shelf4 .hulu{--b:4.6rem;margin:0 2rem 0 1rem}
.picks{display:grid;grid-template-columns:repeat(6,1fr);gap:1.2rem}
.pick{font-size:3.8rem;height:7.4rem;border-radius:1.4rem;border:.3rem solid #c98a4b;background:#fff;font-weight:700}
.pick.sel{background:#ffe08a;border-color:#d98206;box-shadow:0 0 0 .4rem #ffd15c}
.pick.ok{background:#d9f5d0;border-color:#3f9b3a}
.pick.no{border-style:dashed;border-color:#e0483a;background:#ffe9e4}
.count{font-size:2.6rem;font-weight:700;white-space:nowrap}
.slots.two{grid-template-columns:repeat(2,1fr)}
.slot h3{font-size:2.4rem;color:#b02f22}
.slot input[type=text]{width:13rem}.slot input.wide{width:18rem}
input:disabled{background:#f3e9d8;color:#7a5a3a}
.hints{gap:1.5rem}
.top3{display:flex;gap:1.5rem;height:19.5rem;margin-bottom:.5rem;flex:none}
.pic{height:19.5rem;width:27rem;object-fit:contain;background:#fff;border:.25rem solid #f0d3a8;border-radius:1.5rem;flex:none}
.right3{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.top3 .sent{font-size:3rem;min-height:8.8rem;padding:.3rem 1.4rem;line-height:1.35}
.top3 .combo{height:7.4rem}
.top3 .combo .hulu{--b:5.4rem}
.top3 .chip{font-size:3.2rem;height:5.4rem}
.panel{gap:.5rem}

/* 第三版：小廚師 */
main{flex-direction:row;gap:1rem;padding-right:1rem}
.content{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.chef{width:13rem;flex:none;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:1rem;padding-bottom:.5rem}
.chef img{width:100%;height:auto;display:block}
.chef.small{width:10rem}
.bubble{position:relative;background:#fff;border:.25rem solid #e0483a;border-radius:1.4rem;padding:.7rem .8rem;font-size:1.9rem;font-weight:700;line-height:1.3;text-align:center;color:#8f2418;width:100%}
.bubble::after{content:"";position:absolute;left:50%;bottom:-1.1rem;margin-left:-.9rem;border:.9rem solid transparent;border-top-color:#e0483a;border-bottom:0}
.chef.small .bubble{font-size:1.6rem;padding:.5rem .5rem}
.chef img.hop{animation:hop .7s ease-out}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-2.2rem)}60%{transform:translateY(0)}78%{transform:translateY(-.8rem)}}
.shelf4 .hulu{--b:4rem;margin:0 1.6rem 0 .8rem}
.pick{font-size:3.4rem}
.slot input[type=text]{width:12rem}.slot input.wide{width:16rem}
.chip.hole{background:#fff;border-style:dashed;border-color:#c98a4b;min-width:6rem}
.top3 .combo{gap:1.4rem}
.top3 .blank{width:9rem}
</style>
</head>
<body>
<div id="stage">
  <header>
    <h1>AABB 糖葫蘆小店</h1>
    <div class="tabs" id="tabs"></div>
    <button class="top" id="fsBtn">全螢幕</button>
    <button class="top" id="resetBtn">重新開始</button>
  </header>
  <div class="awning"></div>
  <main id="main"></main>
  <footer>
    <button class="btn" id="prevBtn">◀ 上一關</button>
    <button class="btn" id="retryBtn">↺ 重試</button>
    <button class="btn pri" id="nextBtn">下一關 ▶</button>
  </footer>
</div>

/* ---------- 狀態 ---------- */
function shuffledBacks() {
  const correct = FRONTS.map(f => ANS[f]);
  let a;
  do {
    a = correct.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  } while (a.some((b, i) => b === correct[i]));   // 不讓正確答案剛好在正下方
  return a;
}
const freshL1 = () => ({ sel: [], res: {}, msg: '', strung: false, anim: false });

let S = { screen: 0, l1: freshL1(), l2: freshL2(), l3: freshL3() };

/* ---------- 小工具（所有文字都以純文字節點加入） ---------- */
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else if (k === 'disabled') e.disabled = true;
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
const $ = id => document.getElementById(id);
function ball(ch, cls, delay) {
  return h('span', { class: 'ball ' + cls, style: delay ? 'animation-delay:' + delay : null }, ch);
}
function hulu(chars, o = {}) {
  const half = Math.ceil(chars.length / 2);
  return h('div', { class: 'hulu' + (o.small ? ' small' : '') }, h('span', { class: 'stick' }),
    chars.map((c, i) => ball(c, (c ? (i < half ? 'ca' : 'cb') : 'empty') + (o.anim ? ' pop' : ''), o.anim ? (i * 0.45) + 's' : null)));
}
function ask(text, yes) {
  const o = h('div', { class: 'overlay' }, h('div', { class: 'dialog' }, h('p', null, text),
    h('div', { class: 'row' },
      h('button', { class: 'btn', onclick: () => o.remove() }, '取消'),
      h('button', { class: 'btn pri', onclick: () => { o.remove(); yes(); } }, '確定'))));
  $('stage').append(o);
}

function render() {
  const tabs = $('tabs'); tabs.replaceChildren();
  TABS.forEach((t, i) => tabs.append(h('button', { class: 'tab' + (i === S.screen ? ' on' : ''), onclick: () => go(i) }, t)));
  $('prevBtn').disabled = S.screen === 0;
  $('nextBtn').disabled = S.screen === 3;
  $('retryBtn').style.visibility = S.screen === 3 ? 'hidden' : 'visible';
  const m = $('main'); m.replaceChildren();
  const content = h('div', { class: 'content' });
  const r = [renderL1, renderL2, renderL3, renderSum][S.screen](content) || {};
  const say = r.say || ['哪些詞語可以變成 AABB？', '和旁邊的同學想出新口味！', '', '前字兩次，後字兩次！'][S.screen];
  m.append(content, h('aside', { class: 'chef' + (S.screen === 2 ? ' small' : '') },

    h('img', { class: r.hop ? 'hop' : '', src: CHEF, alt: '糖葫蘆小廚師' })));
}

    class: 'pick kai' + (s.res[w] ? ' ' + s.res[w] : s.sel.includes(w) ? ' sel' : ''),
    onclick: () => {
      if (s.strung || s.res[w] === 'ok') return;
      if (s.sel.includes(w)) { s.sel = s.sel.filter(x => x !== w); delete s.res[w]; s.msg = ''; }
      else if (s.sel.length >= 4) s.msg = '最多選四個。想換一個，先按一次取消。';
      else { s.sel.push(w); s.msg = ''; }
      render();
    }
  }, w)));
  const check = () => {
    let wrong = false;
    s.sel.forEach(w => { s.res[w] = GOOD.includes(w) ? 'ok' : 'no'; if (s.res[w] === 'no') wrong = true; });
    s.msg = wrong ? '再想一想：虛線的詞語變成 AABB，讀起來通順嗎？可以修改。' : '四個都選對了！';
    render();
  };
  const bottom = h('div', { class: 'row' });
  if (s.strung) bottom.append(h('div', { class: 'slogan' }, '有些詞語可以變成 AABB，但不是每個詞語都可以。'));
  else {
    bottom.append(h('div', { class: 'count' }, '已選 ' + s.sel.length + '／4'),
      h('div', { class: 'msg', style: 'min-width:44rem' }, s.msg));
    if (allOk) bottom.append(h('button', { class: 'btn pri', onclick: () => { s.strung = true; s.anim = true; s.msg = ''; render(); } }, '串糖葫蘆'));
    else bottom.append(h('button', { class: 'btn pri', disabled: s.sel.length < 4, onclick: check }, '檢查'));
  }
  m.append(h('div', { class: 'l1b' },
    h('div', { class: 'task' }, '選出四個可以變成 AABB 的詞語。'),
    shelf, picks,
    h('div', { class: 'tip' }, s.strung
      ? ['一起讀出四個詞語。', h('br'), '美麗：通常不說「美美麗麗」。　書包：是物件名稱，不能說「書書包包」。']
      : '先想一想，再按詞語卡；再按一次可以取消。'),
    bottom));
}

/* ---------- 第二關：兩組分享 ---------- */
function renderL2(m) {
  const s = S.l2;
  const slots = h('div', { class: 'slots two' });
  s.g.forEach((g, i) => {
    const submit = () => {
      g.a = g.a.trim(); g.b = g.b.trim();
      if (!g.b) { s.msg = '請先輸入 AABB 詞語。'; render(); return; }
      g.done = true; s.anim = i;
      s.msg = Array.from(g.b).length === 4 ? '' : '糖葫蘆有四粒，看看要不要修改？';
      render();
    };
    const onKey = e => { if (e.key === 'Enter') submit(); };
    slots.append(h('div', { class: 'slot' },
      h('h3', null, i === 0 ? '第一組' : '第二組'),
      h('div', { class: 'orig kai' }, g.done && g.a ? g.a + ' →' : ' '),
      g.done ? hulu(Array.from(g.b).slice(0, 6), { anim: s.anim === i }) : hulu(['', '', '', '']),
      h('div', { class: 'form' },
        h('label', null, '原來的詞語', h('input', { type: 'text', class: 'kai', value: g.a, maxlength: 6, autocomplete: 'off',
          disabled: g.done, oninput: e => { g.a = e.target.value; }, onkeydown: onKey })),
        h('label', null, 'AABB 詞語', h('input', { type: 'text', class: 'kai wide', value: g.b, maxlength: 8, autocomplete: 'off',
          disabled: g.done, oninput: e => { g.b = e.target.value; }, onkeydown: onKey }))),
      h('div', { class: 'row' },
        h('button', { class: 'btn pri', disabled: g.done, onclick: submit }, '串起來'),
        h('button', { class: 'btn', disabled: !g.done, onclick: () => { g.done = false; s.msg = ''; render(); } }, '修改'))));
  });
  s.anim = -1;
  m.append(
    h('div', { class: 'prompt' }, '和旁邊的同學想一想：還有哪些詞語可以變成 AABB？'),
    slots,
    h('div', { class: 'tip' }, '小提示：不是每個詞語都可以變成 AABB，還要讀得通、意思合適。'),
    h('div', { class: 'hints' },
      s.hint ? ['心情可以怎樣？', '課室可以怎樣？', '做功課可以怎樣？'].map(t => h('span', null, t))
             : h('div', { class: 'msg' }, s.msg),
      h('button', { class: 'btn sm' + (s.hint ? ' on' : ''), onclick: () => { s.hint = !s.hint; render(); } }, '提示')));
}

/* ---------- 第三關 ---------- */
function renderL3(m) {
  const s = S.l3, w = s.cur;
  const cardRow = (step) => h('div', { class: 'cards' },
    WORDS.map(x => h('button', { class: 'card kai' + (x === w ? ' on' : '') + (s.q[x].confirmed ? ' done' : ''),
      onclick: () => { s.cur = x; render(); } }, x)),
    h('div', { class: 'steps' },
      STEP_NAMES.map((_, i) => h('span', { class: 'dot' + (i + 1 === step ? ' on' : i + 1 < step ? ' past' : '') }, i + 1)),
      h('span', { style: 'margin-left:.6rem' }, STEP_NAMES[step - 1])));

  /* 步驟一：未選詞語 */
  if (!w) {
    m.append(
      h('div', { class: 'top3' }, h('div', { class: 'sent dim', style: 'flex:1' }, '按下面一張詞語卡，看看圖片和句子。')),
      cardRow(1),
      h('div', { class: 'panel' }, h('div', { class: 'ask' }, '先選一個詞語：清楚、彎曲，還是高興？')));
    return { say: '先選一個詞語！' };
  }

  const q = s.q[w], d = Q[w];
  const step = !q.aabb ? 2 : !q.wordSet ? 3 : !q.placed ? 4 : !q.confirmed ? 5 : 6;
  const hidden = step === 6 && q.hide;

  /* 上方：課本圖片和句子 */
  const sent = h('div', { class: 'sent kai' }, h('span', { class: 's' }, d.pre,
    q.placed && !hidden ? h('span', { class: 'fill' }, aabb(w) + q.de + q.word) : h('span', { class: 'blank' }),
    d.post, q.confirmed ? h('span', { class: 'tick' }, '✓') : null));

  /* 糖葫蘆和獨立詞牌：AABB　［的／地］　［詞語］ */
  const combo = h('div', { class: 'combo' });
  const c = Array.from(w);
  if (!q.aabb) combo.append(hulu(c));
  else {
    combo.append(h('div', { class: 'hulu' }, h('span', { class: 'stick' }),
      ball(c[0], 'ca'), ball(c[0], 'ca' + (s.anim ? ' grow' : ''), s.anim ? '.3s' : null),
      ball(c[1], 'cb'), ball(c[1], 'cb' + (s.anim ? ' grow' : ''), s.anim ? '1.4s' : null)),
      h('span', { class: 'chip kai' + (q.de ? '' : ' hole') }, q.de || '　'),
      h('span', { class: 'chip w kai' + (q.word ? '' : ' hole'), id: 'wchip' }, q.word || '　'));
  }
  if (hidden) combo.style.visibility = 'hidden';
  s.anim = false;
  const top = h('div', { class: 'top3' },
    h('img', { class: 'pic', src: IMG[w], alt: d.alt }),
    h('div', { class: 'right3' }, sent, combo));

  /* 下方：目前步驟的操作 */
  const p = h('div', { class: 'panel' });
  const add = (...k) => p.append(...k.filter(x => x != null && x !== false));
  const clearDone = () => { q.placed = false; q.confirmed = false; q.ref = false; q.hide = false; };
  const editWord = () => { q.wordSet = false; q.de = null; clearDone(); render(); };   // 改詞語：清除「的／地」
  const editDe = () => { clearDone(); render(); };
  let say;

  if (step === 2) {
    say = '前字兩次，後字兩次！';
    add(h('div', { class: 'ask' }, '先一起說：「' + w + '」變成 AABB 是甚麼？'),
      h('button', { class: 'btn pri big', onclick: () => { q.aabb = true; s.anim = true; render(); } }, '變成 AABB'));
  } else if (step === 3) {
    say = '後面接甚麼？和同學說一說！';
    const setWord = () => { if (!q.word.trim()) return; q.word = q.word.trim(); q.wordSet = true; q.de = null; render(); };
    const okBtn = h('button', { class: 'btn pri', disabled: !q.word.trim(), onclick: setWord }, '選好了');
    add(
      h('div', { class: 'ask' }, '後面可以接甚麼？先和旁邊的同學說一說。'),
      q.hint ? null : h('div', { class: 'note' }, '請一組回答，由老師輸入。'),
      h('div', { class: 'row' },
        h('input', { type: 'text', class: 'kai wide', value: q.word, maxlength: 10, autocomplete: 'off', placeholder: '填入詞語',
          oninput: e => { q.word = e.target.value; const ch = $('wchip'); ch.textContent = q.word || '　';
            ch.classList.toggle('hole', !q.word); okBtn.disabled = !q.word.trim(); },
          onkeydown: e => { if (e.key === 'Enter') setWord(); } }),
        h('button', { class: 'btn' + (q.hint ? ' on' : ''), onclick: () => { q.hint = !q.hint; render(); } }, '需要提示'),
        okBtn),
      q.hint ? h('div', { class: 'row' }, h('span', { class: 'ref' }, d.hint),
        d.opts.map(o => h('button', { class: 'btn kai', onclick: () => { q.word = o; render(); } }, o))) : null);
  } else if (step === 4) {
    say = '看看後面的詞語，再選『的』或『地』！';
    add(h('div', { class: 'ask' }, '看看後面的詞語，應該用「的」還是「地」？'),
      h('div', { class: 'row', style: 'gap:4rem' },
        h('button', { class: 'de kai' + (q.de === '的' ? ' on' : ''), onclick: () => { q.de = '的'; render(); } }, '的'),
        h('button', { class: 'de kai' + (q.de === '地' ? ' on' : ''), onclick: () => { q.de = '地'; render(); } }, '地')),
      h('div', { class: 'row' },
        h('button', { class: 'btn', onclick: editWord }, '修改詞語'),
        h('button', { class: 'btn pri', disabled: !q.de, onclick: () => { q.placed = true; render(); } }, '放入句子')));
  } else if (step === 5) {
    say = '放回句子，讀一讀！';
    add(
      h('div', { class: 'ask' }, '全班讀一讀。這句通順嗎？符合圖片和句子的意思嗎？'),
      q.ref ? h('div', { class: 'ref kai' }, '參考答案：' + aabb(w) + d.de + d.word) : null,
      q.ref ? h('div', { class: 'note' }, '參考答案不是唯一答案；其他通順、符合圖片和句意的答案也可以。') : null,
      h('div', { class: 'row' },
        h('button', { class: 'btn', onclick: editWord }, '修改詞語'),
        h('button', { class: 'btn', onclick: editDe }, '改選的／地'),
        h('button', { class: 'btn' + (q.ref ? ' on' : ''), onclick: () => { q.ref = !q.ref; render(); } }, '參考答案'),
        h('button', { class: 'btn pri', onclick: () => { q.confirmed = true; s.hop = true; render(); } }, '教師確認')));
  } else {
    say = '串得好，讀一讀！';
    const left = WORDS.filter(x => !s.q[x].confirmed);
    add(
      h('div', { class: 'ask' }, '一起寫：在課堂紙或小白板寫下填充部分。'),
      h('div', { class: 'row' },
        h('button', { class: 'btn pri', onclick: () => { q.hide = !q.hide; render(); } }, q.hide ? '顯示答案' : '遮住答案'),
        h('button', { class: 'btn', onclick: editWord }, '修改詞語'),
        h('button', { class: 'btn', onclick: editDe }, '改選的／地')),
      h('div', { class: 'msg' }, left.length ? '完成後，可以按上面另一個詞語。' : '三題都完成了！按「下一關」看總結。'));
  }
  m.append(top, cardRow(step), p);
  const hop = s.hop; s.hop = false;
  return { say, hop };
}

/* ---------- 總結 ---------- */
function renderSum(m) {
  const ex = (w, de, word, cap) => h('div', { class: 'ex' }, hulu(Array.from(aabb(w)), { small: true }),
    h('span', { class: 'chip kai' }, de), h('span', { class: 'gap' }), h('span', { class: 'chip w kai' }, word),
    h('span', { class: 'cap' }, cap));
  m.append(h('div', { class: 'sum' },
    h('h2', null, '前字兩次，後字兩次：AABB'),
    ex('彎曲', '的', '小路', '描述小路'),
    ex('高興', '地', '聊天', '說明怎樣聊天'),
    h('div', { class: 'q' }, '今天你會用哪一個 AABB 詞語造句？')));
}

/* ---------- 導覽按鈕 ---------- */
$('prevBtn').onclick = () => go(S.screen - 1);
$('nextBtn').onclick = () => go(S.screen + 1);
$('retryBtn').onclick = () => {
  if (S.screen === 0) ask('重試第一關？現在的選擇會清除。', () => { S.l1 = freshL1(); render(); });
  else if (S.screen === 1) ask('重試第二關？兩組的糖葫蘆會清除。', () => { S.l2 = freshL2(); render(); });
  else if (S.screen === 2) {
    const w = S.l3.cur;
    if (w) ask('重試「' + w + '」這一題？這題的答案會清除。', () => { S.l3.q[w] = freshQ(); render(); });
    else ask('重試第三關？三題的答案會清除。', () => { S.l3 = freshL3(); render(); });
  }
};
$('resetBtn').onclick = () => ask('重新開始整個遊戲？所有關卡的答案都會清除。', () => {
  S = { screen: 0, l1: freshL1(), l2: freshL2(), l3: freshL3() }; render();
});
$('fsBtn').onclick = () => {
  const d = document, el = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else { const f = el.requestFullscreen || el.webkitRequestFullscreen; if (f) f.call(el); }
};
render();
</script>
</body>
</html>
